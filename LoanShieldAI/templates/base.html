<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanShield AI - Cyber Fraud Lending Scan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for cybersecurity icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Navigation Bar -->
    <nav class="border-b border-gray-800 bg-gray-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="bg-gradient-to-tr from-blue-600 to-emerald-500 p-2 rounded-lg text-white">
                        <i class="fas fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">LoanShield AI</span>
                        <span class="hidden sm:inline text-xs text-gray-500 ml-2 border border-gray-800 px-2 py-0.5 rounded-full uppercase tracking-wider font-mono">v1.0.0-Beta</span>
                    </div>
                </div>
                
                <!-- Nav Links -->
                <div class="flex items-center space-x-6">
                    <a href="/" class="text-sm font-medium text-gray-300 hover:text-white transition duration-200"><i class="fas fa-search mr-1.5"></i>Scan</a>
                    <a href="/history" class="text-sm font-medium text-gray-300 hover:text-white transition duration-200"><i class="fas fa-history mr-1.5"></i>Audit History</a>
                    <a href="/compliance" class="text-sm font-medium text-gray-300 hover:text-white transition duration-200"><i class="fas fa-book-open mr-1.5"></i>RBI Guidelines</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-900 bg-gray-950 py-6 mt-12 text-center text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between space-y-3 sm:space-y-0">
            <div>
                <p>&copy; 2026 LoanShield AI. Built for Rajasthan Cyber Security & Public Awareness.</p>
            </div>
            <div class="flex space-x-4">
                <span class="text-gray-600">Secure Sandboxed Engine</span>
                <span>•</span>
                <span class="text-gray-600">RBI Compliance Core v2</span>
                <span>•</span>
                <span class="text-gray-600">VirusTotal Verified</span>
            </div>
        </div>
    </footer>

    <!-- Client-side script logic -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
